<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Político Mundial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: mapa ocupa a tela; cabeçalho com o ano em destaque; linha do tempo fixa na base; legenda flutuando sobre o mapa. */
  :root {
    color-scheme: dark;
    --bg: #121212;
    --surface: #1b1b1f;
    --surface-2: #24242a;
    --border: rgba(255, 255, 255, 0.09);
    --text: #ececf1;
    --text-muted: #9c9ca8;
    --accent: #8ab4f8;
    --ocean: #16161a;
    --graticule: rgba(255, 255, 255, 0.035);
    --country-stroke: #121212;
    --radius: 14px;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);

    --c-esquerda: #b83a3a;
    --c-centro-esquerda: #d97b72;
    --c-centro: #e3c26f;
    --c-centro-direita: #5f8fd3;
    --c-direita: #2f5daa;
    --c-outros: #7c8657;
    --c-colonia: #4a4033;
    --c-colonia-linha: #8f7b58;
    --c-sem-dados: #2e2e34;

    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding-inline: 16px;
  }

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; height: 100dvh; }

  /* ---------- Cabeçalho ---------- */
  .topbar {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; padding-block: 16px 8px;
  }
  .brand { min-width: 0; }
  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600; margin: 0;
  }
  .brand h1 {
    margin: 4px 0 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.25rem, 2.6vw, 1.75rem); letter-spacing: -0.02em; text-wrap: balance;
  }
  .year-display { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .year-big {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .era { font-size: 0.9rem; color: var(--text-muted); }

  .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tools button, .tools a {
    height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-size: 0.9rem; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .tools button:hover, .tools a:hover { background: var(--surface-2); border-color: rgba(255,255,255,0.2); }
  .tools a { font-size: 0.8rem; color: var(--accent); }

  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Mapa ---------- */
  .map-wrap { position: relative; min-height: 0; overflow: hidden; border-radius: var(--radius); background: var(--ocean); }
  #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #map:active { cursor: grabbing; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-muted); font-size: 0.9rem; }

  .graticule { fill: none; stroke: var(--graticule); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .country {
    stroke: var(--country-stroke); stroke-width: 0.5; vector-effect: non-scaling-stroke; cursor: pointer;
    transition: fill 0.6s ease, opacity 0.25s ease, filter 0.15s ease;
  }
  .country:hover, .country.active { stroke: #ffffff; stroke-width: 1.4; filter: brightness(1.18); }
  .country.dimmed { opacity: 0.15; }

  .borders-note {
    position: absolute; right: 12px; top: 10px; z-index: 3; margin: 0;
    font-size: 0.7rem; color: var(--text-muted); background: rgba(18,18,18,0.7);
    padding: 4px 8px; border-radius: 6px;
  }

  /* ---------- Legenda ---------- */
  .legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 4;
    background: rgba(27, 27, 31, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 12px 10px; min-width: 230px; box-shadow: var(--shadow);
  }
  .legend h2 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);
    font-weight: 600; margin: 0 0 6px;
  }
  .legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .legend-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text); font: inherit; font-size: 0.82rem; text-align: left; cursor: pointer;
    transition: background 0.15s, opacity 0.2s;
  }
  .legend-item:hover { background: rgba(255,255,255,0.05); }
  .legend-item.off { opacity: 0.35; }
  .legend-item.on { background: rgba(255,255,255,0.08); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  .swatch.hatch {
    background: repeating-linear-gradient(45deg, var(--c-colonia-linha) 0 1.5px, var(--c-colonia) 1.5px 4.5px);
  }
  .legend-item .count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- Linha do tempo ---------- */
  .timeline {
    display: flex; align-items: flex-end; gap: 14px; padding-block: 10px 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .step {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: grid; place-items: center; margin-bottom: 18px; transition: background 0.15s;
  }
  .step:hover { background: var(--surface-2); }
  .step:disabled { opacity: 0.35; cursor: default; }
  .play {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    display: grid; place-items: center; margin-bottom: 18px; transition: color 0.15s, background 0.15s;
  }
  .play:hover { color: var(--text); background: var(--surface); }
  .play.on { color: var(--accent); border-color: var(--accent); }

  .ruler { flex: 1; min-width: 0; padding-inline: 14px; }
  .eras { position: relative; height: 18px; margin-bottom: 6px; }
  .era-band {
    position: absolute; top: 0; height: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden;
  }
  .rail {
    position: relative; height: 54px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    outline: none;
  }
  .rail:focus-visible .rail-line { box-shadow: 0 0 0 2px var(--accent); }
  .rail-line { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 4px; background: var(--surface-2); }
  .rail-fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 4px; background: var(--accent); }
  .rail-ticks { position: absolute; left: 0; right: 0; top: 20px; height: 6px; pointer-events: none; }
  .rail-ticks i { position: absolute; top: 0; width: 1px; height: 4px; background: #3a3a44; }
  .rail-ticks i.dec { height: 7px; background: #55555f; }
  .mark {
    position: absolute; top: 30px; transform: translateX(-50%); padding: 2px 3px; border: 0; border-radius: 5px;
    background: transparent; cursor: pointer; color: var(--text-muted);
    font-family: var(--font-mono); font-size: 0.72rem; font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .mark:hover { color: var(--text); }
  .mark.on { color: var(--accent); font-weight: 600; }
  .thumb {
    position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 5px rgba(138, 180, 248, 0.2), 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none; transition: transform 0.12s;
  }
  .rail.drag .thumb { transform: scale(1.2); }
  .rail:focus-visible .thumb { outline: 2px solid var(--text); outline-offset: 3px; }
  .thumb-lbl {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0d1626; font-family: var(--font-mono); font-weight: 600; font-size: 0.74rem;
    padding: 2px 6px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity 0.12s;
  }
  .rail.drag .thumb-lbl, .rail:hover .thumb-lbl, .rail:focus-visible .thumb-lbl { opacity: 1; }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: fixed; top: 0; left: 0; z-index: 10; width: 330px; max-width: calc(100vw - 24px);
    background: rgba(30, 30, 35, 0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 16px 14px; pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .tooltip.visible { opacity: 1; transform: translateY(0); }
  .tooltip.pinned { pointer-events: auto; }
  .tt-close {
    display: none; position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 0;
    border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--text-muted); font-size: 1.1rem; cursor: pointer;
  }
  .tooltip.pinned .tt-close { display: block; }
  .tt-head { display: flex; align-items: center; gap: 12px; padding-right: 30px; }
  .tt-flag { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
  .tt-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .tt-code { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 2px; font-family: var(--font-mono); }
  .tt-badge {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; padding: 4px 10px 4px 8px;
    border-radius: 999px; font-size: 0.78rem; font-weight: 600;
    background: color-mix(in srgb, var(--c) 18%, transparent);
    color: color-mix(in srgb, var(--c) 55%, #ffffff);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .tt-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .tt-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 0; font-size: 0.84rem; }
  .tt-grid dt { color: var(--text-muted); }
  .tt-grid dd { margin: 0; font-weight: 500; }
  .tt-grid dd small { display: block; color: var(--text-muted); font-weight: 400; font-size: 0.75rem; }
  .tt-desc { margin: 12px 0 0; font-size: 0.82rem; line-height: 1.55; color: #c9c9d2; }
  .tt-note { margin: 8px 0 0; font-size: 0.78rem; color: var(--text-muted); font-style: italic; }
  .tt-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .tt-link { font-size: 0.82rem; font-weight: 600; color: var(--accent); text-decoration: none; }
  .tt-link:hover { text-decoration: underline; }
  .tt-hint { font-size: 0.7rem; color: var(--text-muted); }
  .tooltip.pinned .tt-hint { display: none; }

  @media (max-width: 640px) {
    .topbar { padding-block: 12px 6px; }
    .brand h1 { display: none; }
    .era { font-size: 0.8rem; }
    .tools a { padding: 0 8px; font-size: 0.75rem; }
    .legend { left: 8px; right: 8px; bottom: 8px; min-width: 0; padding: 8px; }
    .legend h2 { display: none; }
    .legend-list { display: flex; overflow-x: auto; gap: 4px; scrollbar-width: none; }
    .legend-list::-webkit-scrollbar { display: none; }
    .legend-item { white-space: nowrap; width: auto; font-size: 0.76rem; }
    .legend-item .count { margin-left: 4px; }
    .borders-note { display: none; }
    .mark.minor { display: none; }
    .eras { display: none; }
    .ruler { padding-inline: 8px; }
    .timeline { gap: 8px; }
    .play { display: none; }
    .tooltip {
      top: auto !important; left: 12px !important; right: 12px; width: auto; max-width: none;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-height: 55%; overflow-y: auto; transform: translateY(16px);
    }
    .tooltip.visible { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
  /* Seção Bússola: tokens próprios no escopo .bussola (escuro por padrão, combinando com o mapa) */
  .bussola {
    --bg: #121212; --surface: #1b1b1f; --ink: #eef0f3; --muted: #a3a9b6; --faint: #6c7280;
    --line: #2a2e36; --grid: #22262d; --dot: #8a90a0; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --q-al: rgba(230, 103, 103, 0.07); --q-ar: rgba(57, 135, 229, 0.08);
    --q-ll: rgba(25, 158, 112, 0.08); --q-lr: rgba(201, 133, 0, 0.08);
    color-scheme: dark;
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    margin-inline: -16px; padding-inline: 16px; padding-block: 56px 48px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .bussola[data-tema="claro"] {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #15171c; --muted: #5d6270; --faint: #9aa0ad;
    --line: #e2e5ea; --grid: #eceef2; --dot: #7b8190; --accent: #2a78d6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --q-al: rgba(227, 73, 72, 0.06); --q-ar: rgba(42, 120, 214, 0.06);
    --q-ll: rgba(27, 175, 122, 0.06); --q-lr: rgba(237, 161, 0, 0.07);
    color-scheme: light;
  }
  /* Reset mínimo só dentro da seção (especificidade zero para o Tailwind vencer) */
  :where(.bussola) *, :where(.bussola) *::before, :where(.bussola) *::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: var(--line); }
  :where(.bussola) :is(h1, h2, h3, p, ol, ul) { margin: 0; padding: 0; }
  :where(.bussola) :is(ol, ul) { list-style: none; }
  :where(.bussola) button { background: transparent; color: inherit; font: inherit; padding: 0; cursor: pointer; }
  :where(.bussola) svg { display: block; }
  .bussola .tnum { font-variant-numeric: tabular-nums; }
  .bussola .bubble { cursor: pointer; }
  .bussola .bubble:focus { outline: none; }
  .bussola .bubble:focus-visible circle.hit { stroke: var(--accent); stroke-width: 2; }
  .bussola input[type=range] { accent-color: var(--accent); width: 100%; }
  .bussola input[type=checkbox] { accent-color: var(--accent); }
  .bussola h2 { text-wrap: balance; }
</style>

</head>
<body>
<div class="app" id="mapa">
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">Espectro político dos governos · 1900 a hoje</p>
      <h1>Mapa Político Mundial</h1>
    </div>
    <div class="year-display" aria-live="polite">
      <span class="year-big" id="year-big">2026</span>
      <span class="era" id="era">Atualidade</span>
    </div>
    <div class="tools">
      <a href="#bussola">Bússola política ↓</a>
      <button type="button" id="zoom-in" aria-label="Aproximar">+</button>
      <button type="button" id="zoom-out" aria-label="Afastar">−</button>
      <button type="button" id="zoom-reset" aria-label="Restaurar visão">⟲</button>
    </div>
  </header>

  <main class="map-wrap" id="map-wrap">
    <svg id="map" role="img" aria-label="Mapa-múndi colorido pelo espectro político do governo de cada país no ano escolhido">
      <defs>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
          <rect width="5" height="5" fill="#4a4033"></rect>
          <line x1="0" y1="0" x2="0" y2="5" stroke="#8f7b58" stroke-width="1.6"></line>
        </pattern>
      </defs>
    </svg>
    <div class="loading" id="loading">Carregando mapa…</div>
    <p class="borders-note">Fronteiras atuais · Ctrl/⌘ + roda para zoom</p>
    <aside class="legend" aria-label="Legenda">
      <h2>Governo no ano escolhido</h2>
      <ul class="legend-list" id="legend-list"></ul>
    </aside>
  </main>

  <footer class="timeline">
    <button type="button" class="step" id="prev" aria-label="Ano anterior">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div class="ruler">
      <div class="eras" id="eras" aria-hidden="true"></div>
      <div class="rail" id="rail" role="slider" tabindex="0" aria-label="Ano do mapa" aria-valuemin="1900" aria-valuemax="2026">
        <div class="rail-line"></div>
        <div class="rail-fill" id="rail-fill"></div>
        <div class="rail-ticks" id="rail-ticks"></div>
        <div class="thumb" id="thumb"><span class="thumb-lbl" id="thumb-lbl">2026</span></div>
      </div>
    </div>
    <button type="button" class="step" id="next" aria-label="Próximo ano">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button type="button" class="play" id="play" aria-label="Animar automaticamente" title="Animar automaticamente">
      <svg id="play-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2v12l10-6z" fill="currentColor"></path></svg>
    </button>
  </footer>
</div>

<section class="bussola" id="bussola" data-tema="escuro" aria-label="Bússola política">
  <div id="bussola-root"></div>
</section>

<div class="tooltip" id="tooltip" role="dialog" aria-live="polite" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
/* ==========================================================================
   LINHA DO TEMPO
   ========================================================================== */
// Anos selecionáveis na régua
const ANOS = [1900, 1910, 1920, 1930, 1940, 1945, 1950, 1960, 1965, 1970, 1975, 1980, 1990, 2000, 2010, 2020, 2026];
// Anos-base do objeto HIST (7 entradas por país); os demais anos vêm de EXTRA
const ANOS_BASE = [1900, 1920, 1940, 1950, 1965, 1980, 2000];
// Rótulos sem texto no celular (para caber)
const ANOS_MENORES = [1910, 1930, 1945, 1965, 1975, 2010];

const ERAS = {
  1900: "Belle Époque e grandes impérios coloniais",
  1910: "Às vésperas da Primeira Guerra",
  1920: "Pós-Primeira Guerra e Revolução Russa",
  1930: "Grande Depressão e ascensão dos autoritarismos",
  1940: "Segunda Guerra Mundial",
  1945: "Fim da Segunda Guerra",
  1950: "Início da Guerra Fria",
  1960: "Ano da África: 17 independências",
  1965: "Descolonização e Guerra do Vietnã",
  1970: "Ditaduras na América Latina e Ostpolitik",
  1975: "Fim dos impérios português e indochinês",
  1980: "Ditaduras militares e virada neoliberal",
  1990: "Queda do Muro e fim do apartheid",
  2000: "Pós-Guerra Fria e globalização",
  2010: "Crise financeira e véspera da Primavera Árabe",
  2020: "Pandemia e onda populista",
  2026: "Atualidade"
};

// Qualquer ano entre ANO_MIN e ANO_MAX pode ser escolhido na régua.
// Os anos de ANOS são marcos com dados próprios; os anos entre eles
// mostram o último marco anterior (o mapa avisa de qual ano veio o dado).
const ANO_MIN = 1900, ANO_MAX = 2026;

// Faixas de época desenhadas acima da régua (em anos)
const FAIXAS = [
  { de: 1900, ate: 1914, rotulo: "Belle Époque" },
  { de: 1914, ate: 1918, rotulo: "1ª Guerra" },
  { de: 1918, ate: 1939, rotulo: "Entreguerras" },

/* ==========================================================================
   RESOLUÇÃO DOS DADOS
   ========================================================================== */
const COD = { E: "esquerda", CE: "centro-esquerda", C: "centro", CD: "centro-direita", D: "direita", O: "outros" };

function nomeBase(id, fallback) {
  if (PAISES[id]) return PAISES[id].nome;
  if (NOMES_EXTRA[id]) return NOMES_EXTRA[id].split("|")[0];
  return fallback || "País";
}
function iso2De(id) {
  if (PAISES[id]) return PAISES[id].iso2;
  if (NOMES_EXTRA[id]) return NOMES_EXTRA[id].split("|")[1];
  return "";
}
function nomeEm(id, ai) {
  const h = NOMES_HIST[id];
  return (h && h[ANOS[ai]]) || nomeBase(id);
}

// Entrada bruta de um território em um índice de ano.
// Procura no próprio ano; se não houver, herda o último registro anterior.
// Retorna { raw, desde } — desde é o ano de onde o dado veio.
// Governo exato de um país de GOVERNOS no ano escolhido (avaliado no meio do ano)
function govEm(id, ano) {
  const g = GOVERNOS[id];
  if (!g) return null;
  const m = ano + 0.5;
  let k = -1;
  for (let i = 0; i < g.length; i++) if (g[i][0] <= m) k = i;
  if (k < 0) return null;
  const ini = Math.max(ANO_MIN, Math.floor(g[k][0]));
  const fim = k + 1 < g.length ? Math.floor(g[k + 1][0]) : null;
  return { raw: g[k][1], desde: ano, periodo: fim === null ? `${ini}–hoje` : ini === fim ? `${ini}` : `${ini}–${fim}` };
}

function bruto(id, ai) {
  if (GOVERNOS[id] && !(anoSel === ANO_MAX && (VINCULO_2026[id] || PAISES[id]))) {
    const g = govEm(id, anoSel);
    if (g) return g;
  }
  if (ANOS[ai] === 2026) {
    if (VINCULO_2026[id]) return { raw: VINCULO_2026[id], desde: 2026 };
    if (PAISES[id]) return { raw: { atual: PAISES[id] }, desde: 2026 };
    // Sem cadastro de hoje: usa o último registro histórico (o tooltip avisa)
  }
  for (let k = ANOS[ai] === 2026 ? ai - 1 : ai; k >= 0; k--) {
    const ano = ANOS[k];
    if (EXTRA[ano] && id in EXTRA[ano]) return { raw: EXTRA[ano][id], desde: ano };
    const bi = ANOS_BASE.indexOf(ano);
    if (bi >= 0) {
      const arr = HIST[id];
      if (arr) return { raw: arr[bi], desde: ano };
    }
  }
  return { raw: null, desde: ANOS[ai] };
}

// Retorna { tipo: soberano|parte|colonia, espectro, lider, cargo, partido, descricao, paiId, paiNome, colonizador, nota, desde }
function resolver(id, ai, profundidade = 0) {
  const { raw, desde, periodo } = bruto(id, ai);
  const r = resolverRaw(raw, id, ai, profundidade);
  if (r && r.desde === undefined) r.desde = desde;
  if (r && r.periodo === undefined && periodo) r.periodo = periodo;
  return r;
}

function resolverRaw(raw, id, ai, profundidade) {
  if (!raw || profundidade > 3) return null;

  if (typeof raw === "object") {
    const p = raw.atual;
    return { tipo: "soberano", espectro: p.espectro, lider: p.lider, cargo: p.cargo, partido: p.partido, descricao: p.descricao, link: p.link };
  }
  if (raw[0] === "@") {
    const [colonizador, nota] = raw.slice(1).split("|");
    return { tipo: "colonia", colonizador, nota };
  }
  if (raw[0] === "#") {
    const [ref, nota] = raw.slice(1).split("|");
    const pai = resolver(ref, ai, profundidade + 1);
    if (!pai) return { tipo: "parte", paiId: ref, paiNome: nomeEm(ref, ai), nota, semDadosPai: true };
    return { ...pai, tipo: pai.tipo === "colonia" ? "colonia" : "parte", paiId: ref, paiNome: nomeEm(ref, ai), nota: nota || pai.nota };
  }
  const [c, lider, descricao] = raw.split("|");
  return { tipo: "soberano", espectro: COD[c], lider, descricao };
}

function categoria(info) {
  if (!info) return "sem-dados";
  if (info.tipo === "colonia") return "colonia";
  if (info.semDadosPai || !info.espectro) return "sem-dados";
  return info.espectro;
}
function corDe(cat) {
  if (cat === "colonia") return "url(#hatch)";
  if (cat === "sem-dados") return SEM_DADOS.cor;
  return ESPECTROS[cat].cor;
}

const escapeHTML = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const flagEmoji = (iso2) => iso2 && iso2.length === 2
  ? String.fromCodePoint(...[...iso2.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65))
  : "🏳️";
const rotuloAno = (a) => (a === 2026 ? "Hoje" : String(a));

/* ==========================================================================
   TOOLTIP
   ========================================================================== */
function buildTooltip(d) {
  const id = d.id;
  const ano = anoSel;
  const info = resolver(id, anoIdx);
  const nome = nomeEm(id, anoIdx) !== nomeBase(id, d.properties?.name) && ano !== 2026
    ? `${nomeBase(id, d.properties?.name)}` : nomeBase(id, d.properties?.name);
  const cat = categoria(info);
  const esp = cat === "colonia" ? COLONIA : cat === "sem-dados" ? SEM_DADOS : ESPECTROS[cat];

  let corpo = "";
  if (!info) {
    corpo = `<p class="tt-desc">Sem dados cadastrados para este território em ${rotuloAno(ano)}.</p>`;
  } else if (info.tipo === "colonia") {
    corpo = `
      <dl class="tt-grid">
        <dt>Governado por</dt><dd>${escapeHTML(info.paiNome || info.colonizador)}</dd>
      </dl>
      <p class="tt-desc">Território colonial: o governo local não era soberano.</p>
      ${info.nota ? `<p class="tt-note">${escapeHTML(info.nota)}</p>` : ""}`;
  } else {
    const linhas = [];
    if (info.tipo === "parte") linhas.push(`<dt>Parte de</dt><dd>${escapeHTML(info.paiNome)}</dd>`);
    if (info.lider) linhas.push(`<dt>Líder</dt><dd>${escapeHTML(info.lider)}${info.cargo ? `<small>${escapeHTML(info.cargo)}</small>` : ""}</dd>`);
    if (info.partido) linhas.push(`<dt>Partido</dt><dd>${escapeHTML(info.partido)}</dd>`);
    corpo = `
      <dl class="tt-grid">${linhas.join("")}</dl>
      ${info.descricao ? `<p class="tt-desc">${escapeHTML(info.descricao)}</p>` : ""}
      ${info.nota ? `<p class="tt-note">${escapeHTML(info.nota)}</p>` : ""}
      ${info.semDadosPai ? `<p class="tt-desc">Sem dados sobre o governo de ${escapeHTML(info.paiNome)} neste ano.</p>` : ""}`;
  }

  const busca = ano === 2026 ? `Política ${nome}` : `História ${nome} ${ano}`;
  const link = (info && info.link) || `https://pt.wikipedia.org/w/index.php?search=${encodeURIComponent(busca)}`;

  tooltip.innerHTML = `
    <button class="tt-close" type="button" aria-label="Fechar">×</button>
    <div class="tt-head">
      <span class="tt-flag" aria-hidden="true">${flagEmoji(iso2De(id))}</span>
      <div>
        <div class="tt-name">${escapeHTML(nome)}</div>
        <div class="tt-code">${escapeHTML(rotuloAno(ano))} · ${escapeHTML(iso2De(id) || "—")}${info && info.periodo ? ` · governo ${info.periodo}` : info && info.desde && info.desde !== ano ? ` · último registro: ${info.desde}` : ""}</div>
      </div>
    </div>
    <span class="tt-badge" style="--c:${esp.cor}">${escapeHTML(esp.rotulo)}</span>
    ${corpo}
    <div class="tt-footer">
      <a class="tt-link" href="${link}" target="_blank" rel="noopener noreferrer">Saber mais →</a>
      <span class="tt-hint">Clique para fixar</span>
    </div>`;

  tooltip.querySelector(".tt-close").addEventListener("click", (e) => { e.stopPropagation(); unpin(); });
}

function positionTooltip(x, y) {
  if (mqMobile.matches) return;
  const pad = 16, w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let left = x + pad, top = y + pad;
  if (left + w > window.innerWidth - 8) left = x - w - pad;
  if (top + h > window.innerHeight - 8) top = y - h - pad;
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${Math.max(8, top)}px`;
}

function showTooltip(d, x, y) {
  buildTooltip(d);
  tooltip.classList.add("visible");
  tooltip.setAttribute("aria-hidden", "false");
  positionTooltip(x, y);
}
function hideTooltip() {
  tooltip.classList.remove("visible", "pinned");
  tooltip.setAttribute("aria-hidden", "true");
}
function pin(node, d, x, y) {
  if (pinned) pinned.node.classList.remove("active");
  pinned = { node, d };
  node.classList.add("active");
  d3.select(node).raise();
  showTooltip(d, x, y);
  tooltip.classList.add("pinned");
}
function unpin() {
  if (pinned) pinned.node.classList.remove("active");
  pinned = null;
  hideTooltip();
}

/* ==========================================================================
   LEGENDA
   ========================================================================== */
function renderLegend() {
  const counts = {};
  features.forEach((f) => {
    const c = categoria(resolver(f.id, anoIdx));
    counts[c] = (counts[c] || 0) + 1;
  });
  const itens = [
    ...Object.entries(ESPECTROS).map(([k, v]) => ({ k, ...v })),
    { k: "colonia", ...COLONIA, hatch: true },
    { k: "sem-dados", ...SEM_DADOS }
  ];
  const list = document.getElementById("legend-list");
  list.innerHTML = itens.map((i) => `
    <li>
      <button class="legend-item ${activeFilter === i.k ? "on" : activeFilter ? "off" : ""}" type="button"
              data-key="${i.k}" aria-pressed="${activeFilter === i.k}">
        <span class="swatch ${i.hatch ? "hatch" : ""}" style="${i.hatch ? "" : `background:${i.cor}`}"></span>
        <span>${i.rotulo}</span>
        <span class="count">${counts[i.k] || 0}</span>
      </button>
    </li>`).join("");
  list.querySelectorAll(".legend-item").forEach((b) => b.addEventListener("click", () => {
    activeFilter = activeFilter === b.dataset.key ? null : b.dataset.key;
    renderCores();
  }));
}

/* ==========================================================================
   RENDERIZAÇÃO POR ANO
   ========================================================================== */
function renderCores() {
  countryPaths
    .style("fill", (d) => corDe(categoria(resolver(d.id, anoIdx))))
    .classed("dimmed", (d) => activeFilter !== null && categoria(resolver(d.id, anoIdx)) !== activeFilter);
  renderLegend();
}

const pct = (ano) => ((ano - ANO_MIN) / (ANO_MAX - ANO_MIN)) * 100;
// Último marco de dados com ano ≤ ano escolhido
const idxPara = (ano) => { let i = 0; ANOS.forEach((a, k) => { if (a <= ano) i = k; }); return i; };
const faixaDe = (ano) => (FAIXAS.find((f) => ano >= f.de && ano < f.ate) || FAIXAS[FAIXAS.length - 1]).rotulo;

function setAno(valor) {
  anoSel = Math.max(ANO_MIN, Math.min(ANO_MAX, Math.round(valor)));
  const novoIdx = idxPara(anoSel);
  const mudouDados = true; // países com GOVERNOS mudam a cada ano
  anoIdx = novoIdx;
  const marco = ANOS[anoIdx];

  document.getElementById("year-big").textContent = anoSel;
  document.getElementById("era").textContent = anoSel === marco
    ? ERAS[marco]
    : `${faixaDe(anoSel)} · 43 países principais ano a ano; os demais com dados de ${marco}`;
  document.getElementById("rail-fill").style.width = `${pct(anoSel)}%`;
  document.getElementById("thumb").style.left = `${pct(anoSel)}%`;
  document.getElementById("thumb-lbl").textContent = anoSel;
  const rail = document.getElementById("rail");
  rail.setAttribute("aria-valuenow", anoSel);
  rail.setAttribute("aria-valuetext", String(anoSel));
  document.querySelectorAll(".mark").forEach((m) => m.classList.toggle("on", +m.dataset.ano === anoSel));
  document.getElementById("prev").disabled = anoSel === ANO_MIN;
  document.getElementById("next").disabled = anoSel === ANO_MAX;

  if (countryPaths && mudouDados) renderCores();
  window.dispatchEvent(new CustomEvent("ano:mapa", { detail: anoSel }));
  if (pinned) { buildTooltip(pinned.d); tooltip.classList.add("pinned"); }
  else if (hoverD && tooltip.classList.contains("visible")) buildTooltip(hoverD);
}

// Régua contínua: qualquer ano de 1900 a 2026; os marcos com dados ficam rotulados
function buildRail() {
  const rail = document.getElementById("rail");

  // Traços: um por ano, mais longos nas décadas
  const ticks = document.getElementById("rail-ticks");
  let html = "";
  for (let a = ANO_MIN; a <= ANO_MAX; a++) {
    if (a % 5 !== 0 && a !== ANO_MAX) continue;
    html += `<i class="${a % 10 === 0 ? "dec" : ""}" style="left:${pct(a)}%"></i>`;
  }
  ticks.innerHTML = html;

  // Rótulos clicáveis dos marcos
  ANOS.forEach((a) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `mark ${ANOS_MENORES.includes(a) ? "minor" : ""}`;
    b.style.left = `${pct(a)}%`;
    b.dataset.ano = a;
    b.tabIndex = -1;
    b.textContent = a === ANO_MAX ? "Hoje" : a;
    b.setAttribute("aria-label", `${a}: ${ERAS[a]}`);
    rail.appendChild(b);
  });

  document.getElementById("eras").innerHTML = FAIXAS.map((f) =>
    `<div class="era-band" style="left:${pct(f.de)}%;width:${pct(f.ate) - pct(f.de)}%">${f.rotulo}</div>`).join("");

  const anoDoPonto = (clientX) => {
    const r = rail.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    return ANO_MIN + f * (ANO_MAX - ANO_MIN);
  };
  let arrastando = false;
  rail.addEventListener("pointerdown", (e) => {
    stopPlay();
    rail.focus({ preventScroll: true });
    // Clique num rótulo de marco vai exatamente para aquele ano
    const mk = e.target.closest(".mark");
    if (mk) { setAno(+mk.dataset.ano); return; }
    arrastando = true;
    rail.classList.add("drag");
    rail.setPointerCapture(e.pointerId);
    setAno(anoDoPonto(e.clientX));
  });
  rail.addEventListener("pointermove", (e) => {
    if (!arrastando) return;
    const a = Math.round(anoDoPonto(e.clientX));
    if (a !== anoSel) setAno(a);
  });
  const soltar = () => { arrastando = false; rail.classList.remove("drag"); };
  rail.addEventListener("pointerup", soltar);
  rail.addEventListener("pointercancel", soltar);
  rail.addEventListener("keydown", (e) => {
    const passo = e.shiftKey ? 10 : 1;
    const mapa = { ArrowRight: passo, ArrowUp: passo, ArrowLeft: -passo, ArrowDown: -passo, PageUp: 10, PageDown: -10 };
    if (e.key in mapa) { e.preventDefault(); stopPlay(); setAno(anoSel + mapa[e.key]); }
    if (e.key === "Home") { e.preventDefault(); stopPlay(); setAno(ANO_MIN); }
    if (e.key === "End") { e.preventDefault(); stopPlay(); setAno(ANO_MAX); }
  });
}

/* ---------- Animação opcional ---------- */
const ICON_PLAY = '<path d="M4 2v12l10-6z" fill="currentColor"></path>';
const ICON_PAUSE = '<rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect>';

function stopPlay() {
  if (!playTimer) return;
  clearInterval(playTimer); playTimer = null;
  document.getElementById("play-icon").innerHTML = ICON_PLAY;
  document.getElementById("play").classList.remove("on");
  document.getElementById("play").setAttribute("aria-label", "Animar automaticamente");
}
function startPlay() {
  if (anoSel >= ANO_MAX) setAno(ANO_MIN);
  document.getElementById("play-icon").innerHTML = ICON_PAUSE;
  document.getElementById("play").classList.add("on");
  document.getElementById("play").setAttribute("aria-label", "Pausar animação");
  playTimer = setInterval(() => {
    if (anoSel >= ANO_MAX) { stopPlay(); return; }
    setAno(anoSel + 1);
  }, reduzMov ? 600 : 220);
}

/* ==========================================================================
   MAPA
   ========================================================================== */
const zoom = d3.zoom().scaleExtent([1, 10])
  .filter((e) => (e.type !== "wheel" || e.ctrlKey || e.metaKey) && !e.button)
  .on("zoom", (e) => {
  gRoot.attr("transform", e.transform);
  if (pinned && !mqMobile.matches) unpin();
});

function layout() {
  const { width, height } = wrap.getBoundingClientRect();
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  const bottomGap = mqMobile.matches ? 64 : 12;
  projection.fitExtent([[10, 10], [width - 10, height - bottomGap]], { type: "FeatureCollection", features });
  gRoot.select(".graticule").attr("d", path(d3.geoGraticule10()));
  countryPaths.attr("d", path);
  zoom.translateExtent([[-width * 0.25, -height * 0.25], [width * 1.25, height * 1.25]]);
}

function init() {
  features = topojson.feature(TOPO, TOPO.objects.countries).features.filter((f) => f.id !== "010");
  gRoot.append("path").attr("class", "graticule");

  countryPaths = gRoot.selectAll("path.country")
    .data(features)
    .join("path")
    .attr("class", "country")
    .on("pointerenter", function (e, d) {
      if (e.pointerType !== "mouse" || pinned) return;
      hoverD = d;
      d3.select(this).raise();
      showTooltip(d, e.clientX, e.clientY);
    })
    .on("pointermove", (e) => { if (e.pointerType === "mouse" && !pinned) positionTooltip(e.clientX, e.clientY); })
    .on("pointerleave", (e) => { if (e.pointerType === "mouse" && !pinned) { hoverD = null; hideTooltip(); } })
    .on("click", function (e, d) {
      e.stopPropagation();
      if (pinned && pinned.node === this) { unpin(); return; }
      pin(this, d, e.clientX, e.clientY);
    });

  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", unpin);

  layout();
  buildRail();
  setAno(anoSel);
  document.getElementById("loading").remove();
}

/* ---------- Controles ---------- */
document.getElementById("prev").addEventListener("click", () => { stopPlay(); setAno(anoSel - 1); });
document.getElementById("next").addEventListener("click", () => { stopPlay(); setAno(anoSel + 1); });
document.getElementById("play").addEventListener("click", () => (playTimer ? stopPlay() : startPlay()));
document.getElementById("zoom-in").addEventListener("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.6));
document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6));
document.getElementById("zoom-reset").addEventListener("click", () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") unpin();
  if (e.target.id === "rail") return;
  if (e.key === "ArrowRight") { stopPlay(); setAno(anoSel + (e.shiftKey ? 10 : 1)); }
  if (e.key === "ArrowLeft") { stopPlay(); setAno(anoSel - (e.shiftKey ? 10 : 1)); }
});
window.addEventListener("ano:bussola", (e) => { if (e.detail !== anoSel) setAno(e.detail); });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => features.length && layout(), 120); });

const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)"];
const MAX_SEL = 3;

/* ============================================================
   GEOMETRIA E BUSCA NO TEMPO
   ============================================================ */
const VB = 640;
const PAD = { l: 44, r: 20, t: 20, b: 44 };
const PW = VB - PAD.l - PAD.r;
const PH = VB - PAD.t - PAD.b;
const sx = (v) => PAD.l + ((v + 10) / 20) * PW;
const sy = (v) => PAD.t + ((10 - v) / 20) * PH;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const TRANSICAO = 0.6; // anos que a bolha leva para ir de um governo ao seguinte

// O ano escolhido vale para o meio do ano (1964 → julho de 1964)
const instante = (t) => t + 0.5;

// Índice do governo em vigor num instante
function idxGov(pais, momento) {
  let k = -1;
  pais.g.forEach((r, i) => { if (r[0] <= momento) k = i; });
  return k;
}

// Posição com transição suave entre governos
function posAt(pais, t) {
  const m = instante(t);
  const k = idxGov(pais, m);
  if (k < 0) return null;
  const cur = pais.g[k], prev = k > 0 ? pais.g[k - 1] : null;
  const f = Math.min(1, Math.max(0, (m - cur[0]) / TRANSICAO));
  const k2 = ease(f);
  const temCur = cur[1] !== null, temPrev = prev && prev[1] !== null;
  if (!temCur && !temPrev) return null;
  if (!temCur) return { x: prev[1], y: prev[2], o: 1 - k2 };
  if (!temPrev || f >= 1) return { x: cur[1], y: cur[2], o: temPrev ? 1 : k2 };
  return { x: prev[1] + (cur[1] - prev[1]) * k2, y: prev[2] + (cur[2] - prev[2]) * k2, o: 1 };
}

const fimDe = (pais, i) => (i + 1 < pais.g.length ? Math.floor(pais.g[i + 1][0]) : null);
const periodo = (pais, i) => {
  const ini = Math.max(ANO_MIN, Math.floor(pais.g[i][0]));
  const fim = fimDe(pais, i);
  return fim === null ? `${ini}–hoje` : ini === fim ? `${ini}` : `${ini}–${fim}`;
};
const faseDe = (ano) => (FASES.find((f) => ano >= f.de && ano < f.ate) || FASES[FASES.length - 1]).txt;

const descrever = (x, y) => {
  const e = x <= -6 ? "Esquerda" : x <= -2 ? "Centro-esquerda" : x < 2 ? "Centro" : x < 6 ? "Centro-direita" : "Direita";
  const a = y >= 6 ? "autoritário" : y >= 2 ? "tendência autoritária" : y > -2 ? "moderado" : "libertário";
  return `${e} · ${a}`;
};

/* ============================================================
   TEMA
   ============================================================ */
function useTheme() {
  const [modo, setModo] = useState(() => {
    try { return localStorage.getItem("bussola-tema") || "escuro"; } catch { return "escuro"; }
  });
  useEffect(() => {
    const sec = document.getElementById("bussola");
    if (sec) sec.setAttribute("data-tema", modo);
    try { localStorage.setItem("bussola-tema", modo); } catch {}
  }, [modo]);
  return [modo, setModo];
}

/* ============================================================
   COMPONENTES
   ============================================================ */
function Bussola({ t, selecionados, toggle, hover, setHover }) {
  const ticks = [-10, -5, 0, 5, 10];
  const m = instante(t);

  const ordem = useMemo(
    () => [...PAISES].sort((a, b) => selecionados.indexOf(a.id) - selecionados.indexOf(b.id)),
    [selecionados]
  );

  return (
    <svg viewBox={`0 0 ${VB} ${VB}`} className="w-full h-auto block select-none" role="img"
         aria-label="Bússola política: eixo horizontal esquerda–direita econômica, eixo vertical libertário–autoritário">
      <rect x={sx(-10)} y={sy(10)} width={PW / 2} height={PH / 2} fill="var(--q-al)" />
      <rect x={sx(0)} y={sy(10)} width={PW / 2} height={PH / 2} fill="var(--q-ar)" />
      <rect x={sx(-10)} y={sy(0)} width={PW / 2} height={PH / 2} fill="var(--q-ll)" />
      <rect x={sx(0)} y={sy(0)} width={PW / 2} height={PH / 2} fill="var(--q-lr)" />

      {ticks.map((v) => (
        <g key={v}>
          <line x1={sx(v)} x2={sx(v)} y1={sy(10)} y2={sy(-10)} stroke={v === 0 ? "var(--faint)" : "var(--grid)"} strokeWidth={v === 0 ? 1.25 : 1} />
          <line x1={sx(-10)} x2={sx(10)} y1={sy(v)} y2={sy(v)} stroke={v === 0 ? "var(--faint)" : "var(--grid)"} strokeWidth={v === 0 ? 1.25 : 1} />
          <text x={sx(v)} y={sy(-10) + 16} textAnchor="middle" fontSize="11" fill="var(--faint)" fontFamily="var(--font-mono)">{v}</text>
          <text x={sx(-10) - 8} y={sy(v) + 4} textAnchor="end" fontSize="11" fill="var(--faint)" fontFamily="var(--font-mono)">{v}</text>
        </g>
      ))}

      <g fontSize="11" fontFamily="var(--font-body)" fill="var(--muted)" letterSpacing="0.06em">
        <text x={sx(-10) + 10} y={sy(10) + 18}>ESQUERDA AUTORITÁRIA</text>
        <text x={sx(10) - 10} y={sy(10) + 18} textAnchor="end">DIREITA AUTORITÁRIA</text>
        <text x={sx(-10) + 10} y={sy(-10) - 10}>ESQUERDA LIBERTÁRIA</text>
        <text x={sx(10) - 10} y={sy(-10) - 10} textAnchor="end">DIREITA LIBERTÁRIA</text>
      </g>

      <text x={VB / 2} y={VB - 8} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--ink)" fontFamily="var(--font-body)">
        ← Esquerda · Economia · Direita →
      </text>
      <text transform={`translate(13 ${VB / 2}) rotate(-90)`} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--ink)" fontFamily="var(--font-body)">
        ← Libertário · Social · Autoritário →
      </text>

      {/* Rastros: todos os governos desde 1900, com o ano rotulado na primeira posição de cada década */}
      {selecionados.map((id, si) => {
        const p = PAISES.find((q) => q.id === id);
        const atual = idxGov(p, m);
        const decadas = new Set();
        const pts = p.g
          .map((r, i) => ({ r, i }))
          .filter(({ r, i }) => r[1] !== null && (i + 1 >= p.g.length || p.g[i + 1][0] > ANO_MIN))
          .map(({ r, i }) => {
            const ano = Math.max(ANO_MIN, Math.floor(r[0]));
            const dec = Math.floor(ano / 10);
            const rot = !decadas.has(dec);
            decadas.add(dec);
            return { x: sx(r[1]), y: sy(r[2]), ano, i, rot };
          });
        const cor = SERIES[si];
        return (
          <g key={`rastro-${id}`} pointerEvents="none">
            <polyline points={pts.map((q) => `${q.x},${q.y}`).join(" ")} fill="none" stroke={cor}
                      strokeOpacity="0.4" strokeWidth="1.5" strokeLinejoin="round" strokeDasharray="1 4" strokeLinecap="round" />
            {pts.map((q) => (
              <g key={q.i}>
                {q.i !== atual && <circle cx={q.x} cy={q.y} r="3" fill={cor} fillOpacity="0.5" stroke="var(--surface)" strokeWidth="1.2" />}
                {q.rot && q.i !== atual && (
                  <text x={q.x + 5} y={q.y - 5} fontSize="9.5" fill="var(--muted)" fontFamily="var(--font-mono)">{q.ano}</text>
                )}
              </g>
            ))}
          </g>
        );
      })}

      {ordem.map((p) => {
        const pos = posAt(p, t);
        if (!pos || pos.o <= 0) return null;
        const si = selecionados.indexOf(p.id);
        const sel = si >= 0;
        const dim = selecionados.length > 0 && !sel;
        const cor = sel ? SERIES[si] : "var(--dot)";
        const op = pos.o * (dim ? 0.35 : 1);
        const aDireita = pos.x < 7;
        return (
          <g key={p.id} className="bubble" transform={`translate(${sx(pos.x)} ${sy(pos.y)})`} opacity={op}
             tabIndex={pos.o > 0.5 ? 0 : -1} role="button" aria-pressed={sel}
             aria-label={`${p.nome}${sel ? ", selecionado" : ""}`}
             onClick={() => toggle(p.id)}
             onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(p.id); } }}
             onMouseEnter={() => setHover(p.id)} onMouseLeave={() => setHover(null)}
             onFocus={() => setHover(p.id)} onBlur={() => setHover(null)}>
            <circle className="hit" r="15" fill="transparent" />
            <circle r={sel ? 9 : 7} fill={cor} stroke="var(--surface)" strokeWidth="2" />
            <text x={aDireita ? 12 : -12} y="4" textAnchor={aDireita ? "start" : "end"} fontSize="11.5"
                  fontWeight={sel || hover === p.id ? 600 : 500} fill={sel ? "var(--ink)" : "var(--muted)"}
                  fontFamily="var(--font-mono)" paintOrder="stroke" stroke="var(--surface)" strokeWidth="3" strokeLinejoin="round">
              {p.id}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function Tooltip({ id, t }) {
  if (!id) return null;
  const p = PAISES.find((q) => q.id === id);
  const pos = posAt(p, t);
  const k = idxGov(p, instante(t));
  const v = p.g[k];
  if (!pos || !v || v[1] === null) return null;
  const left = (sx(pos.x) / VB) * 100;
  const top = (sy(pos.y) / VB) * 100;
  const abaixo = top < 35;
  const alinhar = left > 60 ? "right" : "left";
  return (
    <div className="absolute z-10 pointer-events-none w-64 max-w-[80%] rounded-lg border border-line bg-surface px-3 py-2.5 shadow-lg"
         style={{ top: `${top}%`, [alinhar]: `${alinhar === "left" ? left : 100 - left}%`,
                  transform: `translate(${alinhar === "left" ? "-12px" : "12px"}, ${abaixo ? "18px" : "calc(-100% - 18px)"})` }}>
      <div className="flex items-baseline justify-between gap-2">
        <span className="font-display text-[15px] font-bold text-ink">{p.nome}</span>
        <span className="font-mono text-xs text-muted tnum">{periodo(p, k)}</span>
      </div>
      <div className="mt-0.5 text-[13px] font-medium text-ink">{v[3]}</div>
      <div className="mt-1 text-xs text-muted">{descrever(v[1], v[2])} <span className="font-mono tnum">({v[1] > 0 ? "+" : ""}{v[1]}, {v[2] > 0 ? "+" : ""}{v[2]})</span></div>
      <p className="mt-1.5 text-xs leading-snug text-ink">{v[4]}</p>
    </div>
  );
}

function Historico({ id, cor, t, irPara, onRemove }) {
  const p = PAISES.find((q) => q.id === id);
  const atual = idxGov(p, instante(t));
  const lista = useRef(null);
  const visiveis = p.g.map((r, i) => ({ r, i })).filter(({ i }) => i + 1 >= p.g.length || p.g[i + 1][0] > ANO_MIN);

  // Mantém o governo atual visível na lista
  useEffect(() => {
    const el = lista.current && lista.current.querySelector('[data-atual="1"]');
    if (el && lista.current) {
      const box = lista.current;
      const topo = el.offsetTop - box.offsetTop;
      if (topo < box.scrollTop || topo > box.scrollTop + box.clientHeight - el.offsetHeight) {
        box.scrollTop = topo - box.clientHeight / 2;
      }
    }
  }, [atual]);

  return (
    <section className="rounded-xl border border-line bg-surface p-4 min-w-0">
      <div className="flex items-center justify-between gap-3">
        <h3 className="flex items-center gap-2 font-display text-base font-bold">
          <span className="inline-block h-3 w-3 rounded-full" style={{ background: cor }}></span>{p.nome}
        </h3>
        <button onClick={onRemove} className="rounded-md px-2 py-1 text-xs text-muted hover:bg-bg hover:text-ink">Remover</button>
      </div>
      <p className="mt-1 text-xs text-muted">{visiveis.length} governos de 1900 até hoje · clique para ir ao período</p>
      <ol ref={lista} className="mt-2 grid max-h-80 gap-0.5 overflow-y-auto pr-1">
        {visiveis.map(({ r, i }) => (
          <li key={i} data-atual={i === atual ? "1" : "0"}>
            <button onClick={() => irPara(Math.max(ANO_MIN, Math.ceil(r[0] - 0.5)))}
                    className={`grid w-full grid-cols-[5.6rem_1fr] gap-2 rounded-md px-2 py-1 text-left text-[13px] hover:bg-bg ${i === atual ? "bg-bg" : ""}`}>
              <span className={`font-mono text-[12px] tnum ${i === atual ? "font-semibold text-ink" : "text-muted"}`}>{periodo(p, i)}</span>
              {r[1] !== null ? (
                <span className="min-w-0">
                  <span className={i === atual ? "font-semibold" : ""}>{r[3]}</span>
                  <span className="text-muted"> · {descrever(r[1], r[2])}</span>
                </span>
              ) : <span className="text-faint">{r[3]}: sem governo soberano</span>}
            </button>
          </li>
        ))}
      </ol>
    </section>
  );
}

function App() {
  const [t, setT] = useState(ANO_MAX);
  const [tocando, setTocando] = useState(false);
  const [selecionados, setSelecionados] = useState(["BR", "DE"]);
  const [hover, setHover] = useState(null);
  const [aviso, setAviso] = useState("");
  const [tema, setTema] = useTheme();
  const [sinc, setSinc] = useState(true);
  const sincRef = useRef(sinc);
  sincRef.current = sinc;
  const raf = useRef(null);
  const tRef = useRef(t);
  tRef.current = t;
  const reduz = useMemo(() => window.matchMedia("(prefers-reduced-motion: reduce)").matches, []);

  const parar = useCallback(() => { cancelAnimationFrame(raf.current); raf.current = null; }, []);

  // Desliza até um ano
  const irPara = useCallback((alvo) => {
    parar(); setTocando(false);
    alvo = Math.max(ANO_MIN, Math.min(ANO_MAX, alvo));
    if (reduz) { setT(alvo); return; }
    const ini = tRef.current, dur = Math.min(900, 250 + Math.abs(alvo - ini) * 10), t0 = performance.now();
    const passo = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      setT(ini + (alvo - ini) * ease(k));
      if (k < 1) raf.current = requestAnimationFrame(passo);
    };
    raf.current = requestAnimationFrame(passo);
  }, [parar, reduz]);

  // Play opcional: cerca de 3 anos por segundo
  useEffect(() => {
    if (!tocando) return;
    let atual = tRef.current >= ANO_MAX ? ANO_MIN : tRef.current;
    setT(atual);
    if (reduz) {
      const id = setInterval(() => {
        atual = Math.min(ANO_MAX, Math.floor(atual) + 1); setT(atual);
        if (atual >= ANO_MAX) { clearInterval(id); setTocando(false); }
      }, 400);
      return () => clearInterval(id);
    }
    let last = performance.now();
    const passo = (now) => {
      atual = Math.min(ANO_MAX, atual + ((now - last) / 1000) * 3); last = now;
      setT(atual);
      if (atual >= ANO_MAX) { setTocando(false); return; }
      raf.current = requestAnimationFrame(passo);
    };
    raf.current = requestAnimationFrame(passo);
    return () => cancelAnimationFrame(raf.current);
  }, [tocando, reduz]);

  // Setas do teclado fora do slider: ±1 ano (Shift: ±10)
  useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
      const sec = document.getElementById("bussola");
      if (!sec || sec.getBoundingClientRect().top > window.innerHeight / 2) return;
      if (e.key === "ArrowRight") irPara(Math.round(tRef.current) + (e.shiftKey ? 10 : 1));
      if (e.key === "ArrowLeft") irPara(Math.round(tRef.current) - (e.shiftKey ? 10 : 1));
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [irPara]);

  // Sincroniza o ano com o mapa (nos dois sentidos)
  const anoArred = Math.round(t);
  useEffect(() => {
    if (sincRef.current) window.dispatchEvent(new CustomEvent("ano:bussola", { detail: anoArred }));
  }, [anoArred]);
  useEffect(() => {
    const h = (e) => {
      if (!sincRef.current || Math.round(tRef.current) === e.detail) return;
      parar(); setTocando(false); setT(e.detail);
    };
    window.addEventListener("ano:mapa", h);
    return () => window.removeEventListener("ano:mapa", h);
  }, [parar]);
  useEffect(() => {
    if (sinc) window.dispatchEvent(new CustomEvent("ano:bussola", { detail: Math.round(tRef.current) }));
  }, [sinc]);

  const toggle = (id) => {
    setSelecionados((s) => {
      if (s.includes(id)) { setAviso(""); return s.filter((x) => x !== id); }
      if (s.length >= MAX_SEL) { setAviso(`Compare até ${MAX_SEL} países por vez. Remova um para adicionar outro.`); return s; }
      setAviso(""); return [...s, id];
    });
  };

  const ano = Math.round(t);
  const decadas = [];
  for (let a = ANO_MIN; a <= ANO_MAX; a += 10) decadas.push(a);
  const pctAno = (a) => ((a - ANO_MIN) / (ANO_MAX - ANO_MIN)) * 100;

  return (
    <div className="mx-auto max-w-6xl">
      <header className="flex flex-wrap items-end justify-between gap-4">
        <div className="min-w-0">
          <a href="#mapa" className="text-xs font-semibold uppercase tracking-[0.12em] text-accent hover:underline">↑ Voltar ao mapa</a>
          <h2 className="mt-1 font-display text-3xl font-bold leading-tight sm:text-4xl">Bússola Política</h2>
          <p className="mt-2 max-w-[62ch] text-sm text-muted">
            Onde o governo de cada país esteve na economia e nas liberdades em cada ano desde 1900. Arraste a linha do tempo
            para qualquer ano e clique em uma bolha para ver o rastro histórico do país.
          </p>
        </div>
        <div className="flex rounded-lg border border-line bg-surface p-0.5 text-xs" role="group" aria-label="Tema">
          {[["escuro", "Escuro"], ["claro", "Claro"]].map(([k, l]) => (
            <button key={k} onClick={() => setTema(k)} aria-pressed={tema === k}
                    className={`rounded-md px-3 py-1.5 ${tema === k ? "bg-bg font-semibold text-ink" : "text-muted hover:text-ink"}`}>{l}</button>
          ))}
        </div>
      </header>

      <div className="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
        <div className="min-w-0">
          <div className="rounded-2xl border border-line bg-surface p-3 sm:p-4">
            <div className="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 px-1">
              <div className="font-display text-5xl font-bold leading-none tnum" aria-live="polite">{ano}</div>
              <div className="text-sm text-muted">{faseDe(ano)}</div>
            </div>
            <div className="relative mt-2">
              <Bussola t={t} selecionados={selecionados} toggle={toggle} hover={hover} setHover={setHover} />
              <Tooltip id={hover} t={t} />
            </div>

            {/* Linha do tempo: qualquer ano de 1900 a 2026 */}
            <div className="mt-2 flex items-center gap-2 px-1">
              <button onClick={() => irPara(ano - 1)} disabled={ano <= ANO_MIN} aria-label="Ano anterior"
                      className="grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-ink hover:bg-bg disabled:opacity-30">
                <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </button>
              <div className="min-w-0 flex-1">
                <label htmlFor="linha-tempo" className="sr-only">Ano</label>
                <input id="linha-tempo" type="range" min={ANO_MIN} max={ANO_MAX} step="1" value={ano}
                       onChange={(e) => { parar(); setTocando(false); setT(parseInt(e.target.value, 10)); }}
                       className="w-full" />
                <div className="relative mt-1 h-5">
                  {decadas.concat(ANO_MAX).map((a) => (
                    <button key={a} onClick={() => irPara(a)}
                            className={`absolute -translate-x-1/2 rounded px-0.5 font-mono text-[10.5px] tnum sm:text-[11px] ${a === ano ? "font-semibold text-accent" : "text-muted hover:text-ink"} ${(a % 20 !== 0 && a !== ANO_MAX) || a === 2020 ? "max-sm:hidden" : ""}`}
                            style={{ left: `calc(${pctAno(a)}% + ${8 - (pctAno(a) / 100) * 16}px)` }}>
                      {a === ANO_MAX ? "Hoje" : a}
                    </button>
                  ))}
                </div>
              </div>
              <button onClick={() => irPara(ano + 1)} disabled={ano >= ANO_MAX} aria-label="Próximo ano"
                      className="grid h-9 w-9 shrink-0 place-items-center rounded-lg border border-line text-ink hover:bg-bg disabled:opacity-30">
                <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </button>
              <button onClick={() => { parar(); setTocando((v) => !v); }}
                      aria-label={tocando ? "Pausar" : "Animar automaticamente"} title={tocando ? "Pausar" : "Animar automaticamente"}
                      className={`grid h-9 w-9 shrink-0 place-items-center rounded-lg border ${tocando ? "border-accent text-accent" : "border-line text-muted hover:text-ink"}`}>
                {tocando ? (
                  <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor" /><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor" /></svg>
                ) : (
                  <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z" fill="currentColor" /></svg>
                )}
              </button>
            </div>
          </div>
          <label className="mt-3 flex items-center gap-2 px-1 text-sm text-ink">
            <input id="sinc-ano" type="checkbox" checked={sinc} onChange={(e) => setSinc(e.target.checked)} />
            Sincronizar o ano com o mapa
          </label>
          <p className="mt-2 px-1 text-xs text-muted">
            Cada governo vale do ano em que começou até o seguinte, então todo ano de 1900 a 2026 tem uma posição.
            Posições são estimativas interpretativas, em escala de −10 a +10. Alemanha de 1949 a 1990 refere-se à Alemanha Ocidental.
          </p>
        </div>

        <aside className="grid content-start gap-4 min-w-0">
          <section>
            <h2 className="text-xs font-semibold uppercase tracking-[0.12em] text-muted">Países</h2>
            <div className="mt-2 flex flex-wrap gap-1.5">
              {PAISES.map((p) => {
                const si = selecionados.indexOf(p.id);
                const sel = si >= 0;
                return (
                  <button key={p.id} onClick={() => toggle(p.id)} aria-pressed={sel}
                          className={`flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs transition-colors ${sel ? "border-transparent bg-surface font-semibold text-ink shadow-sm" : "border-line text-muted hover:text-ink"}`}>
                    <span className="inline-block h-2 w-2 rounded-full" style={{ background: sel ? SERIES[si] : "var(--dot)" }}></span>
                    {p.nome}
                  </button>
                );
              })}
            </div>
            {aviso && <p className="mt-2 text-xs text-muted" role="status">{aviso}</p>}
          </section>

          {selecionados.length === 0 ? (
            <section className="rounded-xl border border-dashed border-line p-4 text-sm text-muted">
              Clique em uma bolha ou em um país acima para ver sua trajetória completa.
            </section>
          ) : selecionados.map((id, i) => (
            <Historico key={id} id={id} cor={SERIES[i]} t={t} irPara={irPara} onRemove={() => toggle(id)} />
          ))}
        </aside>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("bussola-root")).render(<App />);


})();
</script>

</body>
</html>
